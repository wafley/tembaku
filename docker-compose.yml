services:
  tembaku-game:
    image: ghcr.io/wafley/tembaku:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tembaku
    restart: unless-stopped
    ports:
      - '8088:80'
    networks:
      - proxy-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    security_opt:
      - no-new-privileges:true
    read_only: false
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  proxy-network:
    external: true
